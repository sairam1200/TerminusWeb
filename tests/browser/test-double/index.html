<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10151c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Terminus verification fixture</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Terminus test fixture</h1>
        <strong>Evidence: labelled-test-double</strong>
      </header>
      <p data-testid="connection-status" role="status">Connected</p>
      <section aria-label="Terminal connection">
        <label for="destination">Private WebSocket destination</label>
        <div class="connection-row">
          <input
            id="destination"
            data-testid="destination"
            value="wss://agent.tailnet-example.ts.net"
          />
          <button data-testid="connect" type="button">Connect</button>
          <button type="button" id="interrupt">
            Simulate network interruption
          </button>
        </div>
      </section>
      <section class="terminal-shell" aria-label="Terminal">
        <label for="terminal">Terminal input</label>
        <textarea
          id="terminal"
          data-testid="terminal-input"
          spellcheck="false"
          autofocus
        ></textarea>
      </section>
      <nav data-testid="mobile-key-bar" aria-label="Mobile terminal keys">
        <button type="button" data-key="Control">Ctrl</button>
        <button type="button" data-key="Escape">Esc</button>
        <button type="button" data-key="Tab" data-testid="key-tab">Tab</button>
      </nav>
      <output data-testid="viewport-size" aria-label="Viewport size"></output>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
