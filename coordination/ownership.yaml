version: 1
shared_read_only_for_non_owners:
  - AGENTS.md
  - docs/ARCHITECTURE.md
  - docs/SHARED_CONTRACTS.md
  - docs/DEFINITION_OF_DONE.md
  - coordination/facts.md

sessions:
  session_01:
    name: architecture-integration
    writes:
      - packages/protocol/**
      - packages/security/**
      - docs/ARCHITECTURE.md
      - docs/SHARED_CONTRACTS.md
      - coordination/facts.md
      - coordination/tasks.yaml
      - coordination/status/session-01.md
    integrates: true

  session_02:
    name: web-pwa
    writes:
      - apps/web/**
      - coordination/status/session-02.md

  session_03:
    name: windows-agent
    writes:
      - apps/windows-agent/**
      - coordination/status/session-03.md

  session_04:
    name: control-plane
    writes:
      - services/control-plane/**
      - infrastructure/database/**
      - coordination/status/session-04.md

  session_05:
    name: security-network
    writes:
      - infrastructure/tailscale/**
      - tests/security/**
      - docs/security/**
      - coordination/status/session-05.md

  session_06:
    name: verification-release
    writes:
      - tests/browser/**
      - tests/integration/**
      - tests/contract/**
      - infrastructure/vercel/**
      - .github/workflows/**
      - coordination/status/session-06.md

request_files:
  request_pattern: coordination/requests/from-SS-to-TT-id.request.md
  response_pattern: coordination/requests/from-TT-to-SS-id.response.md
  rule: The source owns an immutable request file and the target owns a separate immutable response file; neither session edits the other file.

governance:
  immutable_under_ordinary_session_tasks:
    - AGENTS.md
    - coordination/ownership.yaml
  change_requires:
    - dedicated_governance_task
    - session_06_independent_review
    - explicit_user_authorization
